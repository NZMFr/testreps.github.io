<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your stats</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="icon-btn" title="Back home">←</a>
    <div class="brand">📊 Your stats</div>
  </header>

  <p id="greeting" class="greeting"></p>

  <section class="section">
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-num" id="streak-now">0</div><div class="stat-label">Current streak 🔥</div></div>
      <div class="stat-card"><div class="stat-num" id="streak-best">0</div><div class="stat-label">Longest streak 🏆</div></div>
      <div class="stat-card"><div class="stat-num" id="total-time">0s</div><div class="stat-label">Total playtime ⏱</div></div>
      <div class="stat-card"><div class="stat-num" id="games-played">0</div><div class="stat-label">Games played 🎮</div></div>
      <div class="stat-card"><div class="stat-num" id="fav-cat">—</div><div class="stat-label">Favorite category 🏷️</div></div>
    </div>
    <p class="muted streak-note">Weekend freezes: Saturday &amp; Sunday never break your streak.</p>
  </section>

  <section class="section">
    <h2 class="section-title">Most played</h2>
    <div id="leaderboard"></div>
    <p id="no-stats" class="hidden">Play some games and your stats will show up here.</p>
  </section>

  <script src="js/common.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
